
<!DOCTYPE html>
<html>
<head>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/highcharts-3d.js"></script>
    <style>
        body {
            background: transparent;
            margin: 0;
            padding: 8px;
            font-family: 'Outfit', sans-serif;
            color: #f8fafc;
        }
        #container {
            height: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <script>
        Highcharts.chart('container', {
            chart: {
                type: 'column',
                options3d: {
                    enabled: true,
                    alpha: 12,
                    beta: 18,
                    depth: 55,
                    viewDistance: 25
                },
                backgroundColor: 'transparent'
            },
            title: {
                text: '📊 จำนวนรายการทรัพย์สินเปรียบเทียบแต่ละบริษัท (3D Bar)',
                style: { color: '#f8fafc', fontSize: '15px', fontFamily: 'Outfit' }
            },
            xAxis: {
                categories: ["LED", "BAM", "SAM", "Chayo555", "GHB", "KBANK", "KTB", "SCB"],
                labels: {
                    style: { color: '#cbd5e1', fontSize: '11px', fontFamily: 'Outfit', fontWeight: 'bold' }
                },
                gridLineWidth: 0
            },
            yAxis: {
                title: { text: 'จำนวนทรัพย์ (รายการ)', style: { color: '#94a3b8' } },
                gridLineColor: 'rgba(255, 255, 255, 0.08)'
            },
            tooltip: {
                pointFormat: '<b>{point.category}</b>: <b>{point.y:,} รายการ</b>'
            },
            plotOptions: {
                column: {
                    depth: 45,
                    colorByPoint: true,
                    dataLabels: {
                        enabled: true,
                        format: '{point.y:,.0f}',
                        style: { color: '#ffffff', textOutline: 'none', fontSize: '10.5px', fontFamily: 'Outfit', fontWeight: 'bold' }
                    }
                }
            },
            series: [{
                name: 'จำนวนทรัพย์',
                data: [{"name": "LED", "y": 45000, "color": "#0891b2"}, {"name": "BAM", "y": 28000, "color": "#3b82f6"}, {"name": "SAM", "y": 14000, "color": "#10b981"}, {"name": "Chayo555", "y": 8500, "color": "#f97316"}, {"name": "GHB", "y": 5200, "color": "#ca8a04"}, {"name": "KBANK", "y": 3800, "color": "#059669"}, {"name": "KTB", "y": 3100, "color": "#0284c7"}, {"name": "SCB", "y": 2900, "color": "#7e22ce"}],
                showInLegend: false
            }],
            credits: { enabled: false }
        });
    </script>
</body>
</html>
