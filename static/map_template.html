<!DOCTYPE html>
<html>
  <head>
    <title>All Asset NPA Map</title>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; padding: 0; overflow: hidden; background-color: #f8fafc; font-family: 'Sarabun', 'Outfit', sans-serif; }
      #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
      
      .tooltip {
        position: absolute;
        pointer-events: none;
        background: rgba(15, 23, 42, 0.96);
        backdrop-filter: blur(8px);
        color: white;
        font-family: 'Sarabun', 'Outfit', sans-serif;
        font-size: 12px;
        padding: 12px 15px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        display: none;
        z-index: 999;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        max-width: 300px;
        line-height: 1.5;
        transition: opacity 0.1s ease;
      }

      #loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: 'Sarabun', sans-serif;
        font-size: 14px;
        color: #1e293b;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(12px);
        padding: 16px 28px;
        border-radius: 9999px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
      .spinner {
        border: 3px solid #e2e8f0;
        border-top: 3px solid #6366f1;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        animation: spin 0.8s linear infinite;
      }

      /* Control Toolbar (Floating Top-Left) */
      .map-controls-panel {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .control-pill-group {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        padding: 4px 6px;
        border-radius: 12px;
        box-shadow: 0 4px 15px -2px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(0, 0, 0, 0.08);
        display: flex;
        gap: 4px;
      }

      .ctrl-btn {
        background: transparent;
        border: none;
        padding: 7px 12px;
        border-radius: 8px;
        font-family: 'Sarabun', sans-serif;
        font-size: 12px;
        font-weight: 600;
        color: #475569;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 6px;
        outline: none;
      }
      .ctrl-btn:hover {
        background: rgba(99, 102, 241, 0.1);
        color: #4f46e5;
      }
      .ctrl-btn.active {
        background: #6366f1;
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
      }

      /* Legend Overlay (Floating Top-Right) */
      #map-legend {
        position: absolute;
        top: 16px;
        right: 16px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        padding: 12px 16px;
        border-radius: 12px;
        box-shadow: 0 4px 15px -2px rgba(0, 0, 0, 0.08);
        font-family: 'Sarabun', sans-serif;
        font-size: 12px;
        z-index: 99;
        display: flex;
        flex-direction: column;
        gap: 6px;
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #334155;
        font-weight: 500;
      }
      .legend-color {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Dark Theme overrides */
      body.dark-theme {
        background-color: #0f172a !important;
      }
      body.dark-theme #loader {
        background: rgba(15, 23, 42, 0.92) !important;
        color: #f8fafc !important;
        border-color: rgba(255, 255, 255, 0.1) !important;
      }
      body.dark-theme .control-pill-group,
      body.dark-theme #map-legend {
        background: rgba(15, 23, 42, 0.92) !important;
        border-color: rgba(255, 255, 255, 0.1) !important;
        box-shadow: 0 4px 15px -2px rgba(0, 0, 0, 0.5) !important;
      }
      body.dark-theme .ctrl-btn {
        color: #94a3b8 !important;
      }
      body.dark-theme .ctrl-btn:hover {
        background: rgba(99, 102, 241, 0.2) !important;
        color: #a5b4fc !important;
      }
      body.dark-theme .ctrl-btn.active {
        background: #6366f1 !important;
        color: #ffffff !important;
      }
      body.dark-theme #map-legend > div:first-child {
        color: #94a3b8 !important;
      }
      body.dark-theme .legend-item {
        color: #e2e8f0 !important;
      }
      body.dark-theme #points-count {
        border-top-color: rgba(255, 255, 255, 0.1) !important;
        color: #94a3b8 !important;
      }
    </style>
  </head>
  <body class="BODY_CLASS_PLACEHOLDER">
    <div id="loader"><div class="spinner"></div> <span id="loader-text">กำลังโหลดและจัดเตรียมข้อมูลแผนที่...</span></div>
    
    <!-- Floating Toolbar Controls -->
    <div class="map-controls-panel">
      <!-- Layer Mode Switcher -->
      <div class="control-pill-group" id="layer-switcher">
        <button class="ctrl-btn active" data-mode="bubble" onclick="switchLayerMode('bubble')">
          <span>🫧</span> บับเบิ้ลกลุ่มทรัพย์สิน
        </button>
        <button class="ctrl-btn" data-mode="scatter" onclick="switchLayerMode('scatter')">
          <span>📍</span> จุดพิกัดรายทรัพย์
        </button>
        <button class="ctrl-btn" data-mode="heatmap" onclick="switchLayerMode('heatmap')">
          <span>🔥</span> แผนที่ความร้อน
        </button>
      </div>

      <!-- Basemap Switcher -->
      <div class="control-pill-group" id="basemap-switcher">
        <button class="ctrl-btn active" data-basemap="carto_light" onclick="switchBasemap('carto_light')">
          <span>☀️</span> สว่าง
        </button>
        <button class="ctrl-btn" data-basemap="carto_dark" onclick="switchBasemap('carto_dark')">
          <span>🌙</span> มืด
        </button>
        <button class="ctrl-btn" data-basemap="osm" onclick="switchBasemap('osm')">
          <span>🗺️</span> ปกติ
        </button>
        <button class="ctrl-btn" data-basemap="satellite" onclick="switchBasemap('satellite')">
          <span>🛰️</span> ดาวเทียม
        </button>
      </div>
    </div>

    <div id="map"></div>
    <div id="tooltip" class="tooltip"></div>
    
    <!-- Legend Overlay inside the Map -->
    <div id="map-legend">
      <div style="font-weight: 600; font-size: 11px; text-transform: uppercase; color: #64748b; margin-bottom: 4px; letter-spacing: 0.5px;">บริษัททรัพย์สิน</div>
      <div class="legend-item"><span class="legend-color" style="background:#f59e0b;"></span>Baania (BAANIA_COUNT)</div>
      <div class="legend-item"><span class="legend-color" style="background:#3b82f6;"></span>BAM (BAM_COUNT)</div>
      <div class="legend-item"><span class="legend-color" style="background:#10b981;"></span>SAM (SAM_COUNT)</div>
      <div class="legend-item"><span class="legend-color" style="background:#a855f7;"></span>DDproperty (DDPROPERTY_COUNT)</div>
      <div class="legend-item"><span class="legend-color" style="background:#06b6d4;"></span>Taladnudbaan (TALADNUDBAAN_COUNT)</div>
      <div class="legend-item"><span class="legend-color" style="background:#ec4899;"></span>ZmyHome (ZMYHOME_COUNT)</div>
      <div style="border-top: 1px solid #e2e8f0; margin-top: 6px; padding-top: 6px; font-size: 10px; color: #94a3b8;" id="points-count">📍 กำลังโหลด...</div>
    </div>

    <!-- Load JS libraries from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/d3-dsv@3/dist/d3-dsv.min.js"></script>
    <script src="https://unpkg.com/deck.gl@9.0.16/dist.min.js"></script>

    <script>
      const tooltip = document.getElementById('tooltip');
      const loader = document.getElementById('loader');
      const loaderText = document.getElementById('loader-text');
      
      const csvBase64 = "CSV_BASE64_PLACEHOLDER";
      let parsedData = [];
      let deckInstance = null;
      let currentMode = 'bubble'; // Default mode is Bubble
      let currentBasemap = document.body.classList.contains('dark-theme') ? 'carto_dark' : 'carto_light';
      
      // Update initial basemap active button state
      document.querySelectorAll('#basemap-switcher .ctrl-btn').forEach(btn => {
        if (btn.dataset.basemap === currentBasemap) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      const BASEMAP_URLS = {
        osm: [
          'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
          'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
          'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
        ],
        carto_light: [
          'https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',
          'https://b.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',
          'https://c.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png'
        ],
        carto_dark: [
          'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
          'https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
          'https://c.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'
        ],
        satellite: [
          'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
        ]
      };

      function handlePointHover(info) {
        if (info && info.object) {
          tooltip.style.left = (info.x + 15) + 'px';
          tooltip.style.top = (info.y + 15) + 'px';
          tooltip.style.display = 'block';
          tooltip.innerHTML = `
            <div style="font-weight: 700; font-size: 13px; margin-bottom: 4px; color: #f8fafc;">${info.object._title || 'ไม่มีชื่อ'}</div>
            <div><span style="color: #94a3b8;">🏢 บริษัท:</span> <b>${info.object._company || '-'}</b></div>
            <div><span style="color: #94a3b8;">🔑 รหัสทรัพย์:</span> ${info.object._id || '-'}</div>
            <div><span style="color: #38bdf8; font-weight: 600;">💰 ราคา:</span> ${info.object._price_str || 'ไม่ระบุ'}</div>
            <div><span style="color: #94a3b8;">📍 จังหวัด:</span> ${info.object._prov || '-'}</div>
            <div><span style="color: #94a3b8;">🏠 ประเภท:</span> ${info.object._type || '-'}</div>
          `;
        } else {
          tooltip.style.display = 'none';
        }
      }

      function buildLayers() {
        const tileUrls = BASEMAP_URLS[currentBasemap] || BASEMAP_URLS.carto_light;
        
        const baseLayer = new deck.TileLayer({
          id: `basemap-${currentBasemap}`,
          data: tileUrls,
          minZoom: 0,
          maxZoom: 19,
          tileSize: 256,
          renderSubLayers: props => {
            const { bbox: {west, south, east, north} } = props.tile;
            return new deck.BitmapLayer(props, {
              data: null,
              image: props.tile.data,
              bounds: [west, south, east, north]
            });
          }
        });

        const layers = [baseLayer];

        if (currentMode === 'bubble') {
          // 🫧 Bubble Cluster Density Layer
          layers.push(new deck.HexagonLayer({
            id: 'bubble-hex-layer',
            data: parsedData,
            getPosition: d => [d.lon, d.lat],
            radius: 3500,
            coverage: 0.88,
            extruded: false,
            colorRange: [
              [99, 102, 241, 140],  // Indigo
              [59, 130, 246, 175],  // Blue
              [16, 185, 129, 200],  // Emerald
              [245, 158, 11, 220],  // Amber
              [239, 68, 68, 240]    // Red (Dense)
            ],
            pickable: true,
            autoHighlight: true,
            highlightColor: [255, 255, 255, 100],
            onHover: info => {
              if (info && info.object) {
                tooltip.style.left = (info.x + 15) + 'px';
                tooltip.style.top = (info.y + 15) + 'px';
                tooltip.style.display = 'block';
                tooltip.innerHTML = `
                  <div style="font-weight: 700; font-size: 13px; color: #38bdf8; margin-bottom: 4px;">🫧 กลุ่มความหนาแน่นทรัพย์สิน</div>
                  <div><span style="color: #94a3b8;">จำนวนทรัพย์สินในโซนนี้:</span> <b style="font-size: 14px; color: #f8fafc;">${info.object.count.toLocaleString()}</b> รายการ</div>
                  <div style="font-size: 11px; color: #cbd5e1; margin-top: 6px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 4px;">💡 ซูมขยายเพื่อดูจุดหมุดรายทรัพย์สิน</div>
                `;
              } else {
                tooltip.style.display = 'none';
              }
            }
          }));

          // Lightweight micro dots overlay
          layers.push(new deck.ScatterplotLayer({
            id: 'bubble-micro-points',
            data: parsedData,
            getPosition: d => [d.lon, d.lat],
            getColor: d => [d.r, d.g, d.b, 110],
            getRadius: 200,
            radiusMinPixels: 1.5,
            radiusMaxPixels: 6,
            pickable: true,
            onHover: handlePointHover
          }));
        } else if (currentMode === 'scatter') {
          // 📍 High-Resolution Scatter Points Layer
          layers.push(new deck.ScatterplotLayer({
            id: 'scatter-full-layer',
            data: parsedData,
            getPosition: d => [d.lon, d.lat],
            getColor: d => [d.r, d.g, d.b, 180],
            getRadius: 300,
            radiusMinPixels: 2.5,
            radiusMaxPixels: 12,
            pickable: true,
            autoHighlight: true,
            highlightColor: [239, 68, 68, 220],
            onHover: handlePointHover
          }));
        } else if (currentMode === 'heatmap') {
          // 🔥 Heatmap Density Layer
          layers.push(new deck.HeatmapLayer({
            id: 'heatmap-density-layer',
            data: parsedData,
            getPosition: d => [d.lon, d.lat],
            getWeight: 1,
            radiusPixels: 35,
            intensity: 1.2,
            threshold: 0.05
          }));
        }

        return layers;
      }

      function switchLayerMode(mode) {
        currentMode = mode;
        document.querySelectorAll('#layer-switcher .ctrl-btn').forEach(btn => {
          if (btn.dataset.mode === mode) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
        if (deckInstance) {
          deckInstance.setProps({ layers: buildLayers() });
        }
      }

      function switchBasemap(basemapKey) {
        currentBasemap = basemapKey;
        document.querySelectorAll('#basemap-switcher .ctrl-btn').forEach(btn => {
          if (btn.dataset.basemap === basemapKey) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
        if (deckInstance) {
          deckInstance.setProps({ layers: buildLayers() });
        }
      }

      async function initMap() {
        try {
          loaderText.innerText = "กำลังแปลงรหัสข้อมูลพิกัด (Base64)...";
          await new Promise(r => setTimeout(r, 10));
          
          const binaryString = atob(csvBase64);
          const bytes = new Uint8Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          
          loaderText.innerText = "กำลังถอดรหัสข้อความภาษาไทย (UTF-8)...";
          await new Promise(r => setTimeout(r, 10));
          const csvText = new TextDecoder("utf-8").decode(bytes);
          
          loaderText.innerText = "กำลังประมวลผลตารางพิกัด...";
          await new Promise(r => setTimeout(r, 10));
          parsedData = d3.csvParse(csvText);
          
          parsedData.forEach(d => {
            d.lon = +d.lon;
            d.lat = +d.lat;
            d.r = +d.r;
            d.g = +d.g;
            d.b = +d.b;
          });

          loaderText.innerText = "กำลังเรนเดอร์แผนที่บับเบิ้ล (Bubble WebGL)...";
          await new Promise(r => setTimeout(r, 10));
          
          document.getElementById('points-count').innerText = `📍 ข้อมูลทั้งหมด ${parsedData.length.toLocaleString()} รายการ`;

          deckInstance = new deck.DeckGL({
            container: 'map',
            initialViewState: {
              longitude: 101.0,
              latitude: 13.2,
              zoom: 5.9,
              minZoom: 4,
              maxZoom: 18
            },
            controller: true,
            layers: buildLayers()
          });
          
          loader.style.display = 'none';
        } catch(err) {
          loaderText.innerHTML = `<span style="color: #ef4444;">❌ โหลดแผนที่ล้มเหลว: ${err.message}</span>`;
          console.error(err);
        }
      }
      
      initMap();
    </script>
  </body>
</html>
