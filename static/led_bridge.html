<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กำลังนำทางไปยัง กรมบังคับคดี (LED)...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Prompt', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .bridge-card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(8, 145, 178, 0.4);
            border-radius: 24px;
            padding: 36px 32px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5), 0 0 35px rgba(8, 145, 178, 0.2);
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon-box {
            width: 64px;
            height: 64px;
            background: rgba(8, 145, 178, 0.15);
            border: 2px solid #0891b2;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 20px auto;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(8, 145, 178, 0.2);
            border-top-color: #06b6d4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 {
            margin: 0 0 8px 0;
            font-size: 1.35rem;
            color: #38bdf8;
            font-weight: 700;
        }
        p {
            margin: 0 0 20px 0;
            color: #94a3b8;
            font-size: 0.88rem;
            line-height: 1.5;
        }
        .info-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 22px;
            text-align: left;
            font-size: 0.85rem;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .info-row:last-child {
            margin-bottom: 0;
        }
        .info-label {
            color: #64748b;
        }
        .info-val {
            color: #f1f5f9;
            font-weight: 600;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, #0891b2 0%, #0284c7 100%);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 14px rgba(8, 145, 178, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(8, 145, 178, 0.5);
        }
        .btn-secondary {
            background: rgba(51, 65, 85, 0.8);
            color: #cbd5e1;
            border: 1px solid #475569;
        }
        .btn-secondary:hover {
            background: #334155;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="bridge-card">
        <div class="icon-box">⚖️</div>
        <div class="spinner"></div>
        <h2>กำลังเปิดทรัพย์สิน กรมบังคับคดี</h2>
        <p>ระบบกำลังนำท่านเข้าสู่หน้ารายละเอียดของกรมบังคับคดี (LED)...</p>
        
        <div class="info-box">
            <div class="info-row">
                <span class="info-label">รหัสทรัพย์ (ID):</span>
                <span class="info-val" id="disp_id">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">หมายเลขคดีแดง:</span>
                <span class="info-val" id="disp_suit">-</span>
            </div>
        </div>

        <form id="ledForm" method="POST" action="https://asset.led.go.th/newbidreg/asset_open.asp" accept-charset="windows-874">
            <div class="btn-group">
                <button type="submit" class="btn btn-primary">👉 เปิดหน้ารายละเอียดทรัพย์ (LED Direct)</button>
                <a href="https://asset.led.go.th/newbidreg/" target="_blank" class="btn btn-secondary">🔍 ไปหน้าค้นหาหลักของกรมบังคับคดี</a>
            </div>
        </form>
    </div>

    <script>
        (function() {
            var searchStr = window.location.search || window.location.hash || '';
            if (searchStr.indexOf('?') !== -1) {
                searchStr = searchStr.substring(searchStr.indexOf('?') + 1);
            } else if (searchStr.indexOf('#') !== -1) {
                searchStr = searchStr.substring(searchStr.indexOf('#') + 1);
            }
            
            var params = new URLSearchParams(searchStr);
            var form = document.getElementById('ledForm');
            
            var aucId = params.get('auc_asset_gen') || params.get('id') || '';
            var suitNo = params.get('law_suit_no') || '';
            var suitYear = params.get('law_suit_year') || '';
            
            document.getElementById('disp_id').textContent = aucId || '-';
            document.getElementById('disp_suit').textContent = (suitNo && suitYear) ? (suitNo + '/' + suitYear) : (suitNo || '-');
            
            params.forEach(function(val, key) {
                var input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = val;
                form.appendChild(input);
            });
            
            // Auto submit form within 150ms if aucId is provided
            if (aucId) {
                setTimeout(function() {
                    form.submit();
                }, 150);
            }
        })();
    </script>
</body>
</html>
